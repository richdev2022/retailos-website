name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          VITE_WEBAPP_URL: https://app.retailos.com
      - uses: actions/upload-artifact@v4
        with:
          name: retailos-website-dist
          path: dist
          retention-days: 7
